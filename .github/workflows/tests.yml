name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # The slides, PDF and previews are drawn by Chromium through Playwright; pip installs only the
      # Python package, the browser (matching that Playwright version) and its system libraries come here.
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Lint with ruff
        run: ruff check . --exclude .venv

      - name: Run tests with coverage
        # No real secrets are needed: ai_service falls back to its mock content
        # generator whenever OPENAI_API_KEY is unset, and the bot is never
        # started (no BOT_TOKEN / Telegram network access) during the test suite.
        run: pytest tests/ --cov=bot --cov=services --cov=database --cov=config --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
