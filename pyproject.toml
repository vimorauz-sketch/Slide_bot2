[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 140
target-version = "py310"
exclude = [".venv", "storage", "templates/templates_overview.jpg"]

[tool.ruff.lint]
# Default-ish rule set: syntax errors, pyflakes (unused imports/vars, undefined names), bare excepts.
select = ["E9", "F", "E722"]
